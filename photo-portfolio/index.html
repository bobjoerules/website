  <title>Miles Chase | Photo Portfolio</title>
  <style>
    .images img {
      display: inline-block;
      width: auto;
      height: 250px;
      cursor: zoom-in;
      transition: opacity 0.5s ease;
    }
    .hi-res {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }
    .img-wrapper {
      position: relative;
      display: inline-block;
      height: 250px;
    }
    @media (max-width: 600px) {
      .img-wrapper {
        position: relative;
        display: inline-block;
        height: 250px;
        max-width: 375px;
      }
    }
    #overlayImg {
      cursor: zoom-out;
    }
  </style>
</head>

  <ul class="menubar" style="list-style-type: none; text-align: center;">
