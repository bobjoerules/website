    <style>
        #extraLinksToggle {
            background: none;
            border: none;
            color: #666666;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            margin-top: 6px;
        }

        #extraLinksToggle.open {
            margin-top: 14px;
        }

        #extraLinksToggle svg {
            width: 22px;
            height: 14px;
            stroke: #666666;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #extraLinksToggle.open svg {
            transform: rotate(180deg);
        }

        .extra-links {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            padding: 0;
        }

        .extra-links.open {
            max-height: 180px;
            opacity: 1;
            padding: 12px 0 4px;
        }
        body {
            overflow: hidden;
        }
    </style>

    <script>
        const extraLinksToggle = document.getElementById("extraLinksToggle");
        const extraLinks = document.getElementById("extraLinks");

        if (extraLinksToggle && extraLinks) {
            extraLinksToggle.addEventListener("click", function () {
                const isOpen = extraLinks.classList.toggle("open");
                extraLinksToggle.classList.toggle("open", isOpen);
                extraLinksToggle.setAttribute("aria-expanded", String(isOpen));
                extraLinks.setAttribute("aria-hidden", String(!isOpen));
                extraLinksToggle.setAttribute("aria-label", isOpen ? "Hide extra links" : "Show more links");
            });
        }
    </script>
