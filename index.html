    <style>
        #extraLinksToggle {
            background: none;
            border: none;
            color: #666666;
            cursor: pointer;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            padding: 10px;
            margin-top: 6px;
        }

        #extraLinksToggle svg {
            width: 22px;
            height: 14px;
            stroke: #666666;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.35s ease;
        }

        #extraLinksToggle.open svg {
            transform: rotate(180deg);
        }

        .extra-links-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s ease;
        }

        .extra-links-wrapper.open {
            grid-template-rows: 1fr;
        }

        .extra-links-inner {
            min-height: 0;
            overflow: hidden;
        }

        .extra-links {
            opacity: 0;
            transition: opacity 0.25s ease;
            padding: 12px 0 12px;
        }

        .extra-links-wrapper.open .extra-links {
            opacity: 1;
        }
    </style>
</head>

    <script>
        const extraLinksToggle = document.getElementById("extraLinksToggle");
        const extraLinksWrapper = document.getElementById("extraLinksWrapper");
        const extraLinks = document.getElementById("extraLinks");
        const linksHero = document.getElementById("linksHero");
        const linksContent = document.getElementById("linksContent");
        const menubar = document.querySelector(".menubar");

        let collapsedHeight = 0;

        function updateHeroSpacing() {
            if (!linksHero || !linksContent) return;
            if (!extraLinksWrapper || !extraLinksWrapper.classList.contains("open")) {
                collapsedHeight = linksContent.offsetHeight;
            }
            const menubarHeight = menubar ? menubar.offsetHeight : 0;
            const availableHeight = window.innerHeight - menubarHeight;
            const topPadding = Math.max(20, Math.round((availableHeight - collapsedHeight) / 2));
            linksHero.style.paddingTop = `${topPadding}px`;
        }

        updateHeroSpacing();
        window.addEventListener("resize", updateHeroSpacing);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(updateHeroSpacing);
        }

        if (extraLinksToggle && extraLinksWrapper) {
            extraLinksToggle.addEventListener("click", function () {
                const isOpen = extraLinksWrapper.classList.toggle("open");
                extraLinksToggle.classList.toggle("open", isOpen);
                extraLinksToggle.setAttribute("aria-expanded", String(isOpen));
                if (extraLinks) {
                    extraLinks.setAttribute("aria-hidden", String(!isOpen));
                }
                extraLinksToggle.setAttribute("aria-label", isOpen ? "Hide extra links" : "Show more links");
            });
        }
    </script>
